<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập & Đăng ký - Hệ thống VIGGA IoT Farm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Roboto', 'sans-serif'] },
                    colors: {
                        material: {
                            purple: '#4e73df',
                            purple_light: '#6e8ff0',
                            teal: '#1cc88a',
                            dark: '#1a1c24',
                            pink: '#e74a3b'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Hiệu ứng nền -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-material-purple/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-material-teal/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden z-10 border border-slate-200">
        <!-- Header thương hiệu -->
        <div class="bg-material-dark p-6 text-center border-b-4 border-material-teal">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-material-teal/10 border border-material-teal/30 mb-3">
                <i class="fa-solid fa-seedling text-material-teal text-2xl"></i>
            </div>
            <h1 class="text-white font-black tracking-widest uppercase text-xl">VIGGA <span class="font-light text-material-teal">IoT FARM</span></h1>
            <p class="text-xs text-gray-400 mt-1">Nền tảng Quản trị Trang trại Thông minh & AI Cloud</p>
        </div>

        <!-- Thanh chuyển Tab: Đăng nhập / Đăng ký -->
        <div class="grid grid-cols-2 border-b border-gray-200 bg-gray-50 text-xs font-black uppercase tracking-wider">
            <button id="tab-btn-login" onclick="switchAuthTab('login')" class="py-3.5 text-material-purple border-b-2 border-material-purple bg-white transition-all">
                <i class="fa-solid fa-right-to-bracket mr-1.5"></i>Đăng nhập
            </button>
            <button id="tab-btn-register" onclick="switchAuthTab('register')" class="py-3.5 text-gray-400 hover:text-gray-600 transition-all">
                <i class="fa-solid fa-user-plus mr-1.5"></i>Tạo tài khoản
            </button>
        </div>

        <div class="p-6 sm:p-7">
            <!-- Thông báo lỗi / thành công -->
            <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-xs font-bold flex items-center"></div>

            <!-- 1. FORM ĐĂNG NHẬP -->
            <form id="form-login" onsubmit="xuLyDangNhap(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 uppercase mb-1">Tên đăng nhập hoặc Email</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                        <input type="text" id="login-username" required placeholder="Nhập username hoặc email..."
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-material-purple focus:ring-1 focus:ring-material-purple">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 uppercase mb-1">Mật khẩu</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                        <input type="password" id="login-password" required placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-material-purple focus:ring-1 focus:ring-material-purple">
                    </div>
                </div>
                <button type="submit" class="w-full bg-material-purple hover:bg-material-purple_light text-white font-bold py-2.5 rounded-lg shadow-md transition-all text-sm uppercase tracking-wider">
                    Truy cập Hệ thống
                </button>
            </form>

            <!-- 2. FORM ĐĂNG KÝ TÀI KHOẢN MỚI -->
            <form id="form-register" onsubmit="xuLyDangKy(event)" class="space-y-3.5 hidden">
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 uppercase mb-1">Họ và tên Chủ trang trại</label>
                    <div class="relative">
                        <i class="fa-solid fa-id-badge absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                        <input type="text" id="reg-fullname" required placeholder="Ví dụ: Nguyễn Văn A"
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-material-teal">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 uppercase mb-1">Tên tài khoản (Username) hoặc Email</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                        <input type="text" id="reg-username" required placeholder="Ví dụ: trangtrai_b"
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-material-teal">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 uppercase mb-1">Mật khẩu</label>
                        <input type="password" id="reg-password" required placeholder="••••••••"
                            class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-material-teal">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 uppercase mb-1">Nhập lại MK</label>
                        <input type="password" id="reg-confirm" required placeholder="••••••••"
                            class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-material-teal">
                    </div>
                </div>
                <button type="submit" class="w-full bg-material-teal hover:bg-emerald-600 text-white font-bold py-2.5 rounded-lg shadow-md transition-all text-sm uppercase tracking-wider">
                    Khởi tạo Trang trại Mới
                </button>
            </form>

            <!-- PHÂN CÁCH MẠNG XÃ HỘI -->
            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-3 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Hoặc đăng nhập thật với</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- NÚT ĐĂNG NHẬP GOOGLE & FACEBOOK THẬT QUA FIREBASE OAUTH POPUP -->
            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="dangNhapMXHThat('Google')"
                    class="flex items-center justify-center py-2.5 px-4 border border-gray-300 rounded-lg hover:bg-gray-50 transition-all text-xs font-bold text-gray-700 shadow-xs">
                    <i class="fa-brands fa-google text-rose-500 text-base mr-2"></i> Google
                </button>
                <button type="button" onclick="dangNhapMXHThat('Facebook')"
                    class="flex items-center justify-center py-2.5 px-4 border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all text-xs font-bold text-white shadow-xs">
                    <i class="fa-brands fa-facebook-f text-base mr-2"></i> Facebook
                </button>
            </div>
        </div>
    </div>

    <!-- TÍCH HỢP FIREBASE AUTHENTICATION SDK (BẬT CỬA SỔ GMAIL & FACEBOOK THẬT) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            FacebookAuthProvider 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // =========================================================================
        // ÔNG DÁN MÃ FIREBASE CONFIG CỦA ÔNG VÀO ĐÂY (Lấy từ console.firebase.google.com)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDsTdaWC9f9mFZSH8G2hj6Jiw5_dBFKJcY",
            authDomain: "iot-project-56ec9.firebaseapp.com",
            projectId: "iot-project-56ec9",
            appId: "1:49548625271:web:29966c7e21d0975fd48d72"
        };

        let auth = null;
        try {
            if (!firebaseConfig.apiKey.includes("DAN_API_KEY")) {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
            }
        } catch (e) {
            console.error("Lỗi khởi tạo Firebase:", e);
        }

        // Hàm băm cố định: Biến mỗi địa chỉ Gmail/Username thành 1 mã số UserId duy nhất (không bao giờ đổi)
        window.taoUserIdCoDinhTuEmail = function(emailOrUsername) {
            const clean = String(emailOrUsername).trim().toLowerCase();
            if (clean === "admin") return 1; // Admin gốc luôn có id = 1 (sở hữu 4 chuồng gốc)
            let hash = 0;
            for (let i = 0; i < clean.length; i++) {
                hash = ((hash << 5) - hash) + clean.charCodeAt(i);
                hash |= 0;
            }
            return (Math.abs(hash) % 90000) + 100; // Ra số cố định từ 100 -> 90099
        };

        // Hàm gọi cửa sổ Popup chọn tài khoản Google / Facebook thật
        window.dangNhapMXHThat = async function(providerName) {
            if (!auth) {
                window.hienThongBao("Bạn chưa dán mã firebaseConfig thật vào dòng 160 của file index.html!", true);
                return;
            }

            try {
                window.hienThongBao(`Đang mở cửa sổ xác thực ${providerName}...`, false);
                const provider = providerName === "Google" 
                    ? new GoogleAuthProvider() 
                    : new FacebookAuthProvider();

                // Luôn hiện bảng chọn tài khoản Gmail để ông dễ test nhiều Gmail khác nhau
                if (providerName === "Google") {
                    provider.setCustomParameters({ prompt: "select_account" });
                }

                // Bật Popup thật của Google / Facebook
                const result = await signInWithPopup(auth, provider);
                const fbUser = result.user;

                const email = fbUser.email || fbUser.uid;
                const fullName = fbUser.displayName || email.split("@")[0];
                const fixedUserId = window.taoUserIdCoDinhTuEmail(email);

                const loggedUser = {
                    id: fixedUserId,
                    username: email,
                    fullName: fullName,
                    photoURL: fbUser.photoURL || "",
                    role: providerName.toUpperCase()
                };

                // Lưu vào danh sách và chuyển thẳng vào trang Quản lý
                const users = window.layDanhSachUsers();
                if (!users.some(u => u.username.toLowerCase() === email.toLowerCase())) {
                    users.push({ ...loggedUser, password: "oauth_verified" });
                    localStorage.setItem("vigga_registered_users", JSON.stringify(users));
                }

                localStorage.setItem("currentUser", JSON.stringify(loggedUser));
                window.hienThongBao(`Xin chào ${fullName}! Đang vào hệ thống...`, false);
                setTimeout(() => {
                    window.location.href = "QuanLy.html";
                }, 500);

            } catch (error) {
                console.error("Lỗi OAuth:", error);
                if (error.code === "auth/popup-closed-by-user") {
                    window.hienThongBao(`Bạn đã đóng cửa sổ đăng nhập ${providerName}.`, true);
                } else if (error.code === "auth/unauthorized-domain") {
                    window.hienThongBao("Tên miền chưa được cấp phép! Hãy thêm tên miền web vào mục Authorized domains trong Firebase Console.", true);
                } else {
                    window.hienThongBao(`Lỗi xác thực ${providerName}: ${error.message}`, true);
                }
            }
        };
    </script>

    <!-- LOGIC ĐĂNG NHẬP & ĐĂNG KÝ TÀI KHOẢN TRỰC TIẾP -->
    <script>
        window.layDanhSachUsers = function() {
            const raw = localStorage.getItem("vigga_registered_users");
            if (raw) return JSON.parse(raw);
            const defaultUsers = [
                { id: 1, username: "admin", password: "123", fullName: "Phan Duy Hoàng", role: "Admin" }
            ];
            localStorage.setItem("vigga_registered_users", JSON.stringify(defaultUsers));
            return defaultUsers;
        };

        window.hienThongBao = function(msg, isError = true) {
            const box = document.getElementById("auth-alert");
            box.className = isError
                ? "mb-4 p-3 rounded-lg text-xs font-bold flex items-center bg-rose-50 text-rose-600 border border-rose-200"
                : "mb-4 p-3 rounded-lg text-xs font-bold flex items-center bg-emerald-50 text-emerald-700 border border-emerald-200";
            box.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'} mr-2"></i> ${msg}`;
        };

        function switchAuthTab(tab) {
            document.getElementById("auth-alert").classList.add("hidden");
            const btnLogin = document.getElementById("tab-btn-login");
            const btnReg = document.getElementById("tab-btn-register");
            const formLogin = document.getElementById("form-login");
            const formReg = document.getElementById("form-register");

            if (tab === 'login') {
                btnLogin.className = "py-3.5 text-material-purple border-b-2 border-material-purple bg-white transition-all";
                btnReg.className = "py-3.5 text-gray-400 hover:text-gray-600 transition-all";
                formLogin.classList.remove("hidden");
                formReg.classList.add("hidden");
            } else {
                btnReg.className = "py-3.5 text-material-teal border-b-2 border-material-teal bg-white transition-all";
                btnLogin.className = "py-3.5 text-gray-400 hover:text-gray-600 transition-all";
                formReg.classList.remove("hidden");
                formLogin.classList.add("hidden");
            }
        }

        async function xuLyDangNhap(e) {
            e.preventDefault();
            const u = document.getElementById("login-username").value.trim();
            const p = document.getElementById("login-password").value;

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: u, password: p })
                });
                if (res.ok) {
                    const userFromServer = await res.json();
                    userFromServer.id = window.taoUserIdCoDinhTuEmail(u);
                    localStorage.setItem("currentUser", JSON.stringify(userFromServer));
                    window.location.href = "QuanLy.html";
                    return;
                }
            } catch (err) {}

            const users = window.layDanhSachUsers();
            const found = users.find(item => item.username.toLowerCase() === u.toLowerCase() && item.password === p);
            if (found) {
                found.id = window.taoUserIdCoDinhTuEmail(found.username);
                localStorage.setItem("currentUser", JSON.stringify(found));
                window.location.href = "QuanLy.html";
            } else {
                window.hienThongBao("Tài khoản hoặc mật khẩu không chính xác!");
            }
        }

        function xuLyDangKy(e) {
            e.preventDefault();
            const fullName = document.getElementById("reg-fullname").value.trim();
            const username = document.getElementById("reg-username").value.trim();
            const password = document.getElementById("reg-password").value;
            const confirm = document.getElementById("reg-confirm").value;

            if (password !== confirm) {
                window.hienThongBao("Mật khẩu xác nhận không khớp!");
                return;
            }

            const users = window.layDanhSachUsers();
            if (users.some(item => item.username.toLowerCase() === username.toLowerCase())) {
                window.hienThongBao("Tên tài khoản / Email này đã được sử dụng!");
                return;
            }

            const newUser = {
                id: window.taoUserIdCoDinhTuEmail(username),
                username: username,
                password: password,
                fullName: fullName,
                role: "Owner"
            };

            users.push(newUser);
            localStorage.setItem("vigga_registered_users", JSON.stringify(users));
            localStorage.setItem("currentUser", JSON.stringify(newUser));

            window.hienThongBao("Tạo tài khoản thành công! Đang khởi tạo trang trại trống...", false);
            setTimeout(() => {
                window.location.href = "QuanLy.html";
            }, 600);
        }
    </script>
</body>

</html>
